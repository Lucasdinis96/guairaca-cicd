name: CI/CD Pipeline

# Quando o pipeline será disparado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

#Permissões necessárias para publicar no Github Pages

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1 - CI - Integração Continua (Teste)
  ci:
    name: CI - Teste e Validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: action/setup-node@v4
        with:
          node-version: '20'
      
      - name:  Instalar HTMLHint (linter de HTML)
        run: npm install -g htmlhint

      - name: Validar sintax do HTML
        run: htmlhint index.html

# JOB 2 - CD: Entrega Continua (Deploy)

  cd:
    name: CD - Deploy no Github Pages
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploument.outputs.page_url }}

    steps:
      - name: Checkout do código
        user: actions/checkout@v4
      
      - name: Configurar Github Pages
        user: action/configure-pages@v4

      - name: Empacotar artefato
        user: actions/uploads-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
  


